<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="logo">
    </div>

        <h1>Log in to Spotify</h1>

        <button class="social-btn google">Continue with Google</button>
        <button class="social-btn facebook">Continue with Facebook</button>
        <button class="social-btn apple">Continue with Apple</button>
        <button class="social-btn phone">Contiue with phone number</button>

        <div class="divider"></div>

        <form>
          <label> Email or username</label>
          <input type="text" placeholder="Email or username">
          <button type="submit" class="continue-btn">Continue</button>
        </form>
        <p class="signuptext">
          Don't have an account? <a href="#">Sign up for Spotify</a>
        </p>
        <br>
        <div class="divider"></div>
         <a href="aboutus.html">Forget Password</a>
        
    

  </div>  
</body>
</html>
